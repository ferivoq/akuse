name: Build and (optionally) Release

on:
  workflow_dispatch:
  create:

jobs:
  build:
    name: Build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && github.event.ref_type == 'tag')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packageScript: npm run package:linux
          - os: macos-latest
            packageScript: npm run package:mac
          - os: windows-latest
            packageScript: npm run package:win
    runs-on: ${{ matrix.os }}
    env:
      ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
      ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
      ANILIST_REDIRECT_URI: ${{ secrets.ANILIST_REDIRECT_URI }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_NOTARIZE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          sudo apt-get install -y libnss3 libxss1 libgbm1 libgtk-3-0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Generate src/modules/clientData.ts from secrets
        shell: bash
        run: |
          if [[ -z "${ANILIST_CLIENT_ID}" || -z "${ANILIST_CLIENT_SECRET}" ]]; then
            echo "Missing required secrets: ANILIST_CLIENT_ID and/or ANILIST_CLIENT_SECRET"
            exit 1
          fi
          node -e "const fs=require('fs');fs.mkdirSync('src/modules',{recursive:true});const data={clientId:Number(process.env.ANILIST_CLIENT_ID),redirectUri:(process.env.ANILIST_REDIRECT_URI||'akuse://index'),clientSecret:String(process.env.ANILIST_CLIENT_SECRET)};const header='import { ClientData } from \"../types/types\";\\n\\n';const body='export const clientData: ClientData = ' + JSON.stringify(data, null, 2) + ';\\n';fs.writeFileSync('src/modules/clientData.ts', header + body);"

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: ${{ matrix.packageScript }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: release/build/**
          if-no-files-found: error

  release:
    name: Create GitHub Release and upload assets
    if: github.event_name == 'create' && github.event.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/build/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}